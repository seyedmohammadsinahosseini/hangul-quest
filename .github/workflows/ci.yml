name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web client (lint · types · tests · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      # Route modules import the database pool during page-data collection, so a
      # placeholder is enough for the build — nothing connects to it at build time.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  mobile:
    name: Mobile client (analyze)
    runs-on: ubuntu-latest
    # Flutter is a large download; keep it non-blocking until the widget tests land
    # (see docs/ROADMAP.md) so a slow runner never blocks a web change.
    continue-on-error: true

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
